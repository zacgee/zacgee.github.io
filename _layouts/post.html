---
layout: default
---
<article class="post">
  <p class="label"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time></p>
  <h1 class="display display--md">{{ page.title | escape }}</h1>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ "/blog/" | relative_url }}">← All writing</a></p>
</article>
